services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      CLAMAV_ADDRESS: tcp://clamav:3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventos
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
    volumes:
      - eventos_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Analyse antivirus des fichiers joints des invités (S-06). Au premier
  # démarrage, le chargement des signatures prend quelques minutes : les
  # fichiers restent « Analyse en cours » et le job réessaie plus tard.
  # Variante Debian : la seule image officielle publiée aussi pour arm64
  # (Mac à puce Apple), clamav/clamav ne l'étant que pour amd64.
  clamav:
    image: clamav/clamav-debian:stable
    ports:
      - "${FORWARD_CLAMAV_PORT:-3310}:3310"
    volumes:
      - eventos_clamav:/var/lib/clamav

volumes:
  eventos_pgdata:
    driver: local
  eventos_clamav:
    driver: local
